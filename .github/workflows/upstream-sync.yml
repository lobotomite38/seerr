---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync from upstream (develop)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pushover_test:
        description: 'Test the Sonarr adapter review alert (no sync).'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: seerr-team/seerr
  UPSTREAM_BRANCH: develop
  FORK_BRANCH: develop
  CUSTOM_BRANCH: lobotomite-seerr
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.pushover_test != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' && secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Set git identity
        shell: bash
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

      - name: Add upstream remote
        shell: bash
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}" --prune
          git fetch --no-tags origin "${FORK_BRANCH}" "${CUSTOM_BRANCH}" --prune

      - name: Detect upstream Sonarr adapter changes
        shell: bash
        run: |
          set -euo pipefail
          previous_ref="origin/${FORK_BRANCH}"
          upstream_ref="upstream/${UPSTREAM_BRANCH}"

          if git diff --quiet "${previous_ref}..${upstream_ref}" -- server/api/servarr/sonarr.ts; then
            echo "UPSTREAM_SONARR_ADAPTER_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          previous_sha="$(git rev-parse --short=12 "$previous_ref")"
          upstream_sha="$(git rev-parse --short=12 "$upstream_ref")"
          adapter_commits="$(
            git log \
              --format='%h %s' \
              --max-count=5 \
              "${previous_ref}..${upstream_ref}" \
              -- server/api/servarr/sonarr.ts
          )"

          {
            echo "UPSTREAM_SONARR_ADAPTER_CHANGED=true"
            echo "UPSTREAM_SONARR_PREVIOUS_SHA=$previous_sha"
            echo "UPSTREAM_SONARR_NEW_SHA=$upstream_sha"
            echo "UPSTREAM_SONARR_ADAPTER_COMMITS<<EOF"
            echo "${adapter_commits:-No Sonarr adapter commit summary available.}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Fast-forward fork develop from upstream
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${FORK_BRANCH}" "origin/${FORK_BRANCH}"
          git merge --ff-only "upstream/${UPSTREAM_BRANCH}"
          git push origin "${FORK_BRANCH}"

      - name: Merge refreshed develop into custom branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${CUSTOM_BRANCH}" --prune
          git checkout -B "${CUSTOM_BRANCH}" "origin/${CUSTOM_BRANCH}"
          if ! git merge --no-edit "${FORK_BRANCH}"; then
            conflict_files="$(git diff --name-only --diff-filter=U || true)"
            {
              echo "SYNC_CONFLICT_FILES<<EOF"
              echo "${conflict_files:-unknown}"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "::error title=Manual upstream merge required::Conflicts while merging ${FORK_BRANCH} into ${CUSTOM_BRANCH}"
            echo "Conflicted files:"
            echo "${conflict_files:-unknown}"
            echo
            echo "Reproduce locally:"
            echo "  git fetch --all --prune"
            echo "  git checkout ${CUSTOM_BRANCH}"
            echo "  git merge origin/${FORK_BRANCH}"
            exit 1
          fi
          git push origin "${CUSTOM_BRANCH}"

      - name: Notify Pushover for upstream Sonarr adapter change
        if: ${{ success() && env.UPSTREAM_SONARR_ADAPTER_CHANGED == 'true' }}
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_APP_TOKEN" ]; then
            echo "Pushover secrets not set; skipping Sonarr adapter review notification."
            exit 0
          fi

          commit_summary="${UPSTREAM_SONARR_ADAPTER_COMMITS:0:200}"
          message="$(cat <<EOF
          Why: This fork has a local season-scoped Sonarr fix that prevents rapid TV-season requests from launching duplicate whole-series searches. Upstream changed the same adapter and merged cleanly, so the implementations may now overlap.

          What to do:
          1. Do not deploy the updated branch yet.
          2. Ask Codex to compare the upstream Sonarr changes with our local fix.
          3. Keep one implementation and retain the Sonarr regression tests.
          4. Run the targeted test, server typecheck, lint, and build before deployment.

          Range: ${UPSTREAM_SONARR_PREVIOUS_SHA}..${UPSTREAM_SONARR_NEW_SHA}
          Commits: ${commit_summary:-unavailable}
          Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )"

          curl --fail-with-body -sS \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Seerr Sonarr review required" \
            --form-string "message=$message" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json

      - name: Notify Pushover on failure
        if: failure()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_APP_TOKEN" ]; then
            echo "Pushover secrets not set; skipping notification."
            exit 0
          fi

          curl --fail-with-body -sS \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Seerr sync failed" \
            --form-string "message=Upstream sync failed for $GITHUB_REPOSITORY. Conflicts: ${SYNC_CONFLICT_FILES:-unknown}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json

  pushover-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pushover_test == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Send Pushover test notification
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_APP_TOKEN" ]; then
            echo "Pushover secrets not set; cannot send test."
            exit 1
          fi

          message="$(cat <<EOF
          TEST ONLY - no action is required now.

          A real alert means upstream Seerr changed the Sonarr adapter that overlaps our local season-scoped fix for duplicate whole-series searches.

          When real: do not deploy; ask Codex to reconcile the upstream and local implementations, keep the regression tests, and run the targeted test, server typecheck, lint, and build before deployment.
          EOF
          )"

          curl --fail-with-body -sS \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Seerr Sonarr review test" \
            --form-string "message=$message" \
            https://api.pushover.net/1/messages.json
